services:
  - type: web
    name: django-recipe-app
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      cd src
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: |
      cd src
      gunicorn recipe_project.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: 'cf-recipe-app.onrender.com,nomalyze.com,www.nomalyze.com'
      - key: SECURE_SSL_REDIRECT
        value: True
      - key: SECURE_HSTS_SECONDS
        value: 31536000
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: True
      - key: SECURE_HSTS_PRELOAD
        value: True
      - key: SECURE_CONTENT_TYPE_NOSNIFF
        value: True
      - key: X_FRAME_OPTIONS
        value: DENY
      - key: SECURE_REFERRER_POLICY
        value: strict-origin-when-cross-origin
      - key: CSRF_TRUSTED_ORIGINS
        value: 'https://nomalyze.com,https://www.nomalyze.com'
      - key: CORS_ALLOWED_ORIGINS
        value: 'https://nomalyze.netlify.app,https://nomalyze.com,https://www.nomalyze.com'
      # --- Cloudflare R2 storage ---
      # USE_R2_STORAGE flips the default file storage backend from local FS
      # to S3-compatible R2 (see settings.py). The four R2_* secrets are
      # marked sync:false so values are managed in the Render dashboard
      # and never committed to the repo.
      - key: USE_R2_STORAGE
        value: True
      - key: R2_BUCKET_NAME
        value: nomalyze-media
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
